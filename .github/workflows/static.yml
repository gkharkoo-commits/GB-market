name: Deploy GB Market Website to GitHub Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Website Artifact for GitHub Pages
        run: |
          mkdir -p _site
          # 1. Copy website contents directly to root of Pages deployment
          cp -r website/* _site/
          # 2. Also keep a 'static' directory alias in _site so both /static/ and relative links work
          cp -r website _site/static
          # 3. Create .nojekyll so Jekyll does not process or block assets
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
