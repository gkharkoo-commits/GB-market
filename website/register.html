<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — GB MARKET</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/GB-market/static/css/styles.css">
</head>
<body style="background-color: #f1f5f9; display: flex; flex-direction: column; min-height: 100vh;">

  <header class="navbar">
    <div class="container nav-container" style="justify-content:center;">
      <a href="/GB-market/static/index.html" class="brand-logo">
        <i class="fa-solid fa-mountain-sun" style="color:#38bdf8;"></i>
        <span>GB MARKET</span>
      </a>
    </div>
  </header>

  <main style="flex:1; display:flex; align-items:center; justify-content:center; padding: 40px 16px;">
    <div class="card" style="width: 100%; max-width: 480px; box-shadow: var(--shadow-lg);">
      <div style="text-align: center; margin-bottom: 24px;">
        <h2 style="color:var(--primary-dark); font-weight:800; font-size:1.6rem;">Create Your Account</h2>
        <p style="color:var(--text-muted); font-size:0.9rem; margin-top:4px;">Join the local marketplace for Gilgit-Baltistan</p>
      </div>

      <div id="error-alert" style="display:none; background:#fee2e2; color:#b91c1c; padding:12px; border-radius:var(--radius-sm); font-size:0.85rem; margin-bottom:16px;"></div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="full_name" class="form-control" placeholder="e.g. Abdul Sattar" required>
        </div>

        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="e.g. yourname@gmail.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Mobile Number</label>
          <input type="tel" id="phone" class="form-control" placeholder="e.g. 03498188394" required>
          <div class="form-hint">Used for order confirmations and delivery updates.</div>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="At least 8 characters" minlength="8" required>
        </div>

        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <input type="password" id="password_confirm" class="form-control" placeholder="Re-enter password" minlength="8" required>
        </div>

        <div class="form-group">
          <label class="form-label">I want to:</label>
          <select id="role-select" class="form-control">
            <option value="customer">Shop as a Customer</option>
            <option value="shopkeeper">Sell products as a Shopkeeper / Merchant</option>
          </select>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-success btn-block" style="margin-top:10px;">
          <i class="fa-solid fa-user-plus"></i> Create Account
        </button>
      </form>

      <div style="text-align:center; margin-top:24px; padding-top:16px; border-top:1px solid var(--border-color); font-size:0.9rem; color:var(--text-muted);">
        Already have an account? <a href="/GB-market/static/login.html" style="color:var(--primary); font-weight:700;">Log In</a>
      </div>
    </div>
  </main>

  <footer style="text-align:center; padding:16px; font-size:0.8rem; color:var(--text-muted);">
    &copy; 2026 GB MARKET &bull; Gilgit-Baltistan, Pakistan
  </footer>

  <script src="/GB-market/static/js/api.js"></script>
  <script>
    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errBox = document.getElementById("error-alert");
      const btn = document.getElementById("submit-btn");
      errBox.style.display = "none";

      const full_name = document.getElementById("full_name").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value;
      const password_confirm = document.getElementById("password_confirm").value;
      const role = document.getElementById("role-select").value;

      if (password !== password_confirm) {
        errBox.textContent = "Passwords do not match!";
        errBox.style.display = "block";
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Creating Account...`;

      try {
        const res = await apiFetch("/auth/register", {
          method: "POST",
          body: JSON.stringify({
            full_name,
            email,
            phone,
            password,
            password_confirm,
            role
          })
        });

        setAuthToken(res.access_token);
        setCurrentUser({
          id: res.user_id,
          email: res.email,
          full_name: res.full_name,
          role: res.role
        });

        if (role === "shopkeeper") {
          window.location.href = "/GB-market/static/shop-register.html";
        } else {
          window.location.href = "/GB-market/static/index.html";
        }
      } catch (err) {
        errBox.textContent = err.message || "Registration failed. Please check your information.";
        errBox.style.display = "block";
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-user-plus"></i> Create Account`;
      }
    });
  </script>
</body>
</html>
