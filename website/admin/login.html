<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — GB MARKET Control Center</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body style="background-color: #0b1329; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column;">

  <header style="background: rgba(15, 23, 42, 0.8); border-bottom: 1px solid rgba(255,255,255,0.1); padding: 16px 0;">
    <div class="container" style="display:flex; justify-content:space-between; align-items:center;">
      <a href="/static/index.html" class="brand-logo" style="color:white;">
        <i class="fa-solid fa-mountain-sun" style="color:#38bdf8;"></i>
        <span>GB MARKET</span>
        <span class="brand-badge" style="background:#d97706;">Admin Access</span>
      </a>
      <a href="/static/index.html" style="font-size:0.85rem; color:#94a3b8;"><i class="fa-solid fa-arrow-left"></i> Customer Marketplace</a>
    </div>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 16px;">
    <div class="card" style="width: 100%; max-width: 440px; background: #0f172a; border: 1px solid #1e293b; color: white; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);">
      
      <div style="text-align: center; margin-bottom: 24px;">
        <div style="width: 56px; height: 56px; margin: 0 auto 12px; background: rgba(217, 119, 6, 0.15); color: #fbbf24; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; border: 1px solid rgba(251, 191, 36, 0.3);">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h2 style="font-size: 1.5rem; font-weight: 800; color: white;">Admin Control Center</h2>
        <p style="color: #94a3b8; font-size: 0.85rem; margin-top: 4px;">Private platform management for Gilgit-Baltistan</p>
      </div>

      <div id="err-box" style="display:none; background:rgba(239, 68, 68, 0.2); border:1px solid #ef4444; color:#fca5a5; padding:12px; border-radius:6px; font-size:0.85rem; margin-bottom:16px;"></div>

      <form id="admin-login-form">
        <div class="form-group">
          <label class="form-label" style="color:#cbd5e1;">Administrator Email or Mobile</label>
          <input type="text" id="admin_identifier" class="form-control" style="background:#1e293b; border-color:#334155; color:white;" placeholder="sattar.kharkoo@gmail.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" style="color:#cbd5e1;">Administrator Password</label>
          <input type="password" id="admin_password" class="form-control" style="background:#1e293b; border-color:#334155; color:white;" placeholder="Enter password" required>
        </div>

        <button type="submit" id="btn-login" class="btn btn-primary btn-block" style="background:#d97706; padding:12px; margin-top:10px;">
          <i class="fa-solid fa-key"></i> Authenticate & Enter Admin Panel
        </button>
      </form>

      <!-- Note: Default admin credentials are set via .env / CLI create_admin.py -->
      <div style="margin-top: 20px; padding: 12px; background: rgba(255, 255, 255, 0.05); border-radius: 6px; text-align: center; font-size: 0.8rem; border: 1px dashed rgba(255,255,255,0.15);">
        <span style="color: #94a3b8;"><i class="fa-solid fa-shield-halved"></i> Initial administrator credentials can be configured using <code>scripts/create_admin.py</code></span>
      </div>

    </div>
  </main>

  <footer style="text-align: center; padding: 20px; font-size: 0.75rem; color: #64748b; border-top: 1px solid rgba(255,255,255,0.05);">
    GB MARKET &bull; Protected Administrator Area &bull; Role-Based Access Control Enforced
  </footer>

  <script src="/static/js/api.js"></script>
  <script>
    document.getElementById("admin-login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errBox = document.getElementById("err-box");
      const btn = document.getElementById("btn-login");
      errBox.style.display = "none";

      const identifier = document.getElementById("admin_identifier").value.trim();
      const password = document.getElementById("admin_password").value;

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Verifying Credentials...`;

      try {
        const res = await apiFetch("/auth/login", {
          method: "POST",
          body: JSON.stringify({ identifier, password })
        });

        // Enforce role check
        if (res.role !== "admin") {
          throw new Error("Access Denied: This account does not possess Administrator privileges.");
        }

        setAuthToken(res.access_token);
        setCurrentUser({
          id: res.user_id,
          email: res.email,
          full_name: res.full_name,
          role: res.role
        });

        // Redirect to admin dashboard
        window.location.href = "/static/admin/index.html";
      } catch (err) {
        errBox.textContent = err.message || "Invalid administrator credentials";
        errBox.style.display = "block";
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-key"></i> Authenticate & Enter Admin Panel`;
      }
    });
  </script>
</body>
</html>
