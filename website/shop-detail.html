<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Profile — GB MARKET</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

  <header class="navbar">
    <div class="container nav-container">
      <a href="/static/index.html" class="brand-logo">
        <i class="fa-solid fa-mountain-sun" style="color:#38bdf8;"></i>
        <span>GB MARKET</span>
      </a>

      <div class="nav-actions">
        <div id="nav-auth-slot"></div>
        <a href="/static/cart.html" class="cart-icon-btn">
          <i class="fa-solid fa-cart-shopping"></i>
          <span>Cart</span>
          <span id="cart-count-badge" class="cart-badge">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="container" style="padding: 32px 16px;">
    
    <div id="shop-header-card" class="card" style="margin-bottom: 32px; padding:0; overflow:hidden;">
      <div id="shop-banner" style="height:200px; background-size:cover; background-position:center; position:relative; background-color:#1e3a8a;">
        <span class="badge badge-approved" style="position:absolute; top:16px; right:16px; font-size:0.85rem;">
          <i class="fa-solid fa-certificate"></i> Verified Merchant
        </span>
      </div>

      <div style="padding:24px;">
        <h1 id="shop-name" style="color:var(--primary-dark); font-size:1.8rem; font-weight:800; margin-bottom:6px;"></h1>
        <div style="display:flex; flex-wrap:wrap; gap:16px; font-size:0.9rem; color:var(--text-muted); margin-bottom:12px;">
          <span><i class="fa-solid fa-location-dot" style="color:var(--secondary);"></i> <span id="shop-location"></span></span>
          <span><i class="fa-solid fa-user"></i> <span id="shop-owner"></span></span>
          <span><i class="fa-solid fa-phone"></i> <span id="shop-phone"></span></span>
          <span><i class="fa-solid fa-clock"></i> <span id="shop-hours"></span></span>
        </div>
        <p id="shop-desc" style="color:var(--text-main); font-size:0.95rem; line-height:1.5;"></p>
      </div>
    </div>

    <div class="section-header">
      <div>
        <h2 class="section-title">Shop Products</h2>
        <p class="section-desc">Inventory available directly from this store</p>
      </div>
    </div>

    <div id="shop-products-grid" class="product-grid">
      <!-- Populated via API -->
    </div>
  </main>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script>
    async function initShopPage() {
      const urlParams = new URLSearchParams(window.location.search);
      const slug = urlParams.get("slug");
      if (!slug) {
        window.location.href = "/static/index.html";
        return;
      }

      try {
        const shop = await apiFetch(`/shops/detail/${slug}`);
        document.title = `${shop.name} — GB MARKET`;
        document.getElementById("shop-name").textContent = shop.name;
        document.getElementById("shop-location").textContent = `${shop.address}, ${shop.locality}, ${shop.city}`;
        document.getElementById("shop-owner").textContent = shop.owner_name;
        document.getElementById("shop-phone").textContent = shop.phone;
        document.getElementById("shop-hours").textContent = shop.opening_hours;
        document.getElementById("shop-desc").textContent = shop.description;

        if (shop.exterior_image) {
          document.getElementById("shop-banner").style.backgroundImage = `url('${shop.exterior_image}')`;
        }

        // Load products by shop
        const res = await apiFetch(`/products/?shop_id=${shop.id}&limit=50`);
        const grid = document.getElementById("shop-products-grid");
        const products = res.items || [];

        if (products.length === 0) {
          grid.innerHTML = `<p class="text-muted" style="grid-column:1/-1;">No products listed yet by this seller.</p>`;
          return;
        }

        grid.innerHTML = products.map(p => {
          const img = p.images && p.images.length > 0 ? p.images[0].image_url : 'https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=600&q=80';
          const isOutOfStock = p.stock_quantity <= 0;
          return `
            <div class="product-card">
              <a href="/static/product-detail.html?slug=${p.slug}" class="product-img-wrapper">
                <img src="${img}" alt="${p.title}">
                <span class="badge-stock">${isOutOfStock ? 'Out of Stock' : `${p.stock_quantity} in stock`}</span>
              </a>
              <div class="product-info">
                <a href="/static/product-detail.html?slug=${p.slug}" class="product-title">${p.title}</a>
                <div class="product-price-row">
                  <span class="price-pkr">PKR ${p.price.toLocaleString()}</span>
                </div>
                <button class="btn-add-cart" ${isOutOfStock ? 'disabled style="opacity:0.5;"' : ''} onclick="handleAddToCart(${p.id})">
                  <i class="fa-solid fa-cart-plus"></i> Add to Cart
                </button>
              </div>
            </div>
          `;
        }).join("");
      } catch (err) {
        alert("Shop not found or not currently active.");
        window.location.href = "/static/index.html";
      }
    }

    async function handleAddToCart(id) {
      try {
        await apiFetch("/cart/items", {
          method: "POST",
          body: JSON.stringify({ product_id: id, quantity: 1 })
        });
        updateCartCountBadge();
        alert("Product added to cart!");
      } catch (e) {
        alert(e.message || "Failed to add product");
      }
    }

    document.addEventListener("DOMContentLoaded", initShopPage);
  </script>
</body>
</html>
