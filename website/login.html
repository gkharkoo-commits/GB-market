<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — GB MARKET</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body style="background-color: #f1f5f9; display: flex; flex-direction: column; min-height: 100vh;">

  <header class="navbar">
    <div class="container nav-container" style="justify-content:center;">
      <a href="/static/index.html" class="brand-logo">
        <i class="fa-solid fa-mountain-sun" style="color:#38bdf8;"></i>
        <span>GB MARKET</span>
      </a>
    </div>
  </header>

  <main style="flex:1; display:flex; align-items:center; justify-content:center; padding: 40px 16px;">
    <div class="card" style="width: 100%; max-width: 440px; box-shadow: var(--shadow-lg);">
      <div style="text-align: center; margin-bottom: 24px;">
        <h2 style="color:var(--primary-dark); font-weight:800; font-size:1.6rem;">Welcome Back</h2>
        <p style="color:var(--text-muted); font-size:0.9rem; margin-top:4px;">Log in to access your GB Market orders & dashboard</p>
      </div>

      <div id="error-alert" style="display:none; background:#fee2e2; color:#b91c1c; padding:12px; border-radius:var(--radius-sm); font-size:0.85rem; margin-bottom:16px;"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Email Address or Mobile Number</label>
          <input type="text" id="identifier" class="form-control" placeholder="e.g. 03498188394 or email@domain.com" required>
        </div>

        <div class="form-group">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <label class="form-label" style="margin:0;">Password</label>
            <a href="javascript:void(0)" onclick="alert('Password reset instructions will be sent to your registered contact.');" style="font-size:0.8rem; color:var(--primary-accent);">Forgot?</a>
          </div>
          <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-block" style="margin-top:10px;">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Log In
        </button>
      </form>

      <div style="text-align:center; margin-top:24px; padding-top:16px; border-top:1px solid var(--border-color); font-size:0.9rem; color:var(--text-muted);">
        Don't have an account yet? <a href="/static/register.html" style="color:var(--secondary); font-weight:700;">Sign Up</a>
      </div>
    </div>
  </main>

  <footer style="text-align:center; padding:16px; font-size:0.8rem; color:var(--text-muted);">
    &copy; 2026 GB MARKET &bull; Gilgit-Baltistan, Pakistan
  </footer>

  <script src="/static/js/api.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errBox = document.getElementById("error-alert");
      const btn = document.getElementById("submit-btn");
      errBox.style.display = "none";

      const identifier = document.getElementById("identifier").value.trim();
      const password = document.getElementById("password").value;

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...`;

      try {
        const res = await apiFetch("/auth/login", {
          method: "POST",
          body: JSON.stringify({ identifier, password })
        });

        setAuthToken(res.access_token);
        setCurrentUser({
          id: res.user_id,
          email: res.email,
          full_name: res.full_name,
          role: res.role
        });

        // Determine destination based on user role or query redirect
        const urlParams = new URLSearchParams(window.location.search);
        const redirect = urlParams.get("redirect");

        if (redirect) {
          window.location.href = redirect;
        } else if (res.role === "admin") {
          window.location.href = "/static/admin/index.html";
        } else if (res.role === "shopkeeper") {
          window.location.href = "/static/seller/index.html";
        } else if (res.role === "rider") {
          window.location.href = "/static/rider/index.html";
        } else {
          window.location.href = "/static/index.html";
        }
      } catch (err) {
        errBox.textContent = err.message || "Invalid credentials. Please try again.";
        errBox.style.display = "block";
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-arrow-right-to-bracket"></i> Log In`;
      }
    });
  </script>
</body>
</html>
