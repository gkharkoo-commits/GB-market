<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account — GB MARKET</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body style="background-color: #f8fafc;">

  <header class="navbar">
    <div class="container nav-container">
      <a href="/static/index.html" class="brand-logo">
        <i class="fa-solid fa-mountain-sun" style="color:#38bdf8;"></i>
        <span>GB MARKET</span>
      </a>

      <div class="nav-actions">
        <div id="nav-auth-slot"></div>
        <a href="/static/index.html" class="nav-btn-link"><i class="fa-solid fa-house"></i> Store</a>
      </div>
    </div>
  </header>

  <main class="container" style="padding: 36px 16px; max-width: 800px;">
    <h1 style="font-size: 1.8rem; font-weight: 800; color: var(--primary-dark); margin-bottom: 24px;">
      <i class="fa-solid fa-circle-user" style="color:var(--secondary);"></i> My Account Settings
    </h1>

    <div id="account-alert" style="display:none; padding:12px; border-radius:var(--radius-sm); margin-bottom:16px;"></div>

    <!-- Profile Details Card -->
    <div class="card" style="margin-bottom: 24px;">
      <h3 style="font-size:1.15rem; font-weight:700; color:var(--primary-dark); margin-bottom:16px; border-bottom:1px solid var(--border-color); padding-bottom:8px;">
        Profile Information
      </h3>

      <form id="profile-form">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" id="prof-name" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label">Email Address (Read-only)</label>
            <input type="email" id="prof-email" class="form-control" readonly style="background:#f1f5f9; cursor:not-allowed;">
          </div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
          <div class="form-group">
            <label class="form-label">Contact Mobile Number</label>
            <input type="tel" id="prof-phone" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label">Account Role</label>
            <input type="text" id="prof-role" class="form-control" readonly style="background:#f1f5f9; text-transform:capitalize;">
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-sm"><i class="fa-solid fa-floppy-disk"></i> Update Profile</button>
      </form>
    </div>

    <!-- Saved Addresses Card -->
    <div class="card" style="margin-bottom: 24px;">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-color); padding-bottom:10px; margin-bottom:16px;">
        <h3 style="font-size:1.15rem; font-weight:700; color:var(--primary-dark); margin:0;">
          Saved Delivery Addresses
        </h3>
        <button onclick="toggleAddressForm()" class="btn btn-outline btn-sm"><i class="fa-solid fa-plus"></i> Add Address</button>
      </div>

      <!-- Add Address Form -->
      <form id="address-form" style="display:none; background:#f8fafc; border:1px solid var(--border-color); padding:16px; border-radius:var(--radius-sm); margin-bottom:16px;">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
          <div class="form-group">
            <label class="form-label">Address Title (e.g. Home, Office)</label>
            <input type="text" id="addr-title" class="form-control" value="Home" required>
          </div>
          <div class="form-group">
            <label class="form-label">Recipient Full Name</label>
            <input type="text" id="addr-name" class="form-control" required>
          </div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
          <div class="form-group">
            <label class="form-label">Recipient Phone</label>
            <input type="tel" id="addr-phone" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label">City</label>
            <select id="addr-city" class="form-control" required>
              <option value="Gilgit">Gilgit</option>
              <option value="Skardu">Skardu</option>
              <option value="Hunza">Hunza</option>
              <option value="Nagar">Nagar</option>
              <option value="Ghizer">Ghizer</option>
              <option value="Diamer">Diamer</option>
              <option value="Astore">Astore</option>
              <option value="Ghanche">Ghanche</option>
              <option value="Shigar">Shigar</option>
              <option value="Kharmang">Kharmang</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Locality / Area</label>
          <input type="text" id="addr-locality" class="form-control" placeholder="e.g. Jutial / Naya Bazar" required>
        </div>

        <div class="form-group">
          <label class="form-label">Full Street Address</label>
          <input type="text" id="addr-line" class="form-control" placeholder="House #, Street name" required>
        </div>

        <div class="form-group">
          <label class="form-label">Landmark (Optional)</label>
          <input type="text" id="addr-landmark" class="form-control" placeholder="Near school, hospital, or chowk">
        </div>

        <div style="display:flex; justify-content:flex-end; gap:8px;">
          <button type="button" onclick="toggleAddressForm()" class="btn btn-outline btn-sm">Cancel</button>
          <button type="submit" class="btn btn-success btn-sm">Save Address</button>
        </div>
      </form>

      <div id="addresses-list" style="display:flex; flex-direction:column; gap:10px;">
        <!-- Populated via JS -->
      </div>
    </div>

    <!-- Change Password Card -->
    <div class="card">
      <h3 style="font-size:1.15rem; font-weight:700; color:var(--primary-dark); margin-bottom:16px; border-bottom:1px solid var(--border-color); padding-bottom:8px;">
        Change Password
      </h3>

      <form id="password-form">
        <div class="form-group">
          <label class="form-label">Current Password</label>
          <input type="password" id="current_password" class="form-control" required>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
          <div class="form-group">
            <label class="form-label">New Password</label>
            <input type="password" id="new_password" class="form-control" minlength="8" required>
          </div>
          <div class="form-group">
            <label class="form-label">Confirm New Password</label>
            <input type="password" id="new_password_confirm" class="form-control" minlength="8" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-sm"><i class="fa-solid fa-key"></i> Update Password</button>
      </form>
    </div>

  </main>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script>
    async function loadAccount() {
      if (!requireAuth()) return;

      try {
        const user = await apiFetch("/users/profile");
        document.getElementById("prof-name").value = user.full_name;
        document.getElementById("prof-email").value = user.email;
        document.getElementById("prof-phone").value = user.phone;
        document.getElementById("prof-role").value = user.role;

        renderAddresses(user.addresses || []);
      } catch (err) {
        console.error("Failed to load profile:", err);
      }
    }

    function renderAddresses(addresses) {
      const container = document.getElementById("addresses-list");
      if (addresses.length === 0) {
        container.innerHTML = `<p class="text-muted" style="font-size:0.85rem;">No saved addresses yet.</p>`;
        return;
      }

      container.innerHTML = addresses.map(a => `
        <div style="display:flex; justify-content:space-between; align-items:center; background:#f8fafc; border:1px solid var(--border-color); padding:12px; border-radius:var(--radius-sm); font-size:0.85rem;">
          <div>
            <div style="font-weight:700; color:var(--primary-dark);">${a.title} &bull; ${a.full_name} (${a.phone})</div>
            <div style="color:var(--text-main); margin-top:2px;">${a.address_line}, ${a.locality}, ${a.city} ${a.landmark ? `(Near ${a.landmark})` : ''}</div>
          </div>
          <button onclick="deleteAddress(${a.id})" class="btn btn-outline btn-sm" style="color:var(--danger); border-color:var(--danger-light); padding:4px 8px;" title="Delete">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
      `).join("");
    }

    function toggleAddressForm() {
      const form = document.getElementById("address-form");
      form.style.display = (form.style.display === "none") ? "block" : "none";
    }

    document.getElementById("profile-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        await apiFetch("/users/profile", {
          method: "PUT",
          body: JSON.stringify({
            full_name: document.getElementById("prof-name").value.trim(),
            phone: document.getElementById("prof-phone").value.trim()
          })
        });
        alert("Profile updated successfully!");
      } catch (err) {
        alert(err.message || "Failed to update profile");
      }
    });

    document.getElementById("address-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        await apiFetch("/users/addresses", {
          method: "POST",
          body: JSON.stringify({
            title: document.getElementById("addr-title").value.trim(),
            full_name: document.getElementById("addr-name").value.trim(),
            phone: document.getElementById("addr-phone").value.trim(),
            city: document.getElementById("addr-city").value,
            locality: document.getElementById("addr-locality").value.trim(),
            address_line: document.getElementById("addr-line").value.trim(),
            landmark: document.getElementById("addr-landmark").value.trim() || null,
            is_default: true
          })
        });
        toggleAddressForm();
        loadAccount();
      } catch (err) {
        alert(err.message || "Failed to add address");
      }
    });

    async function deleteAddress(id) {
      if (!confirm("Delete this address?")) return;
      try {
        await apiFetch(`/users/addresses/${id}`, { method: "DELETE" });
        loadAccount();
      } catch (e) {
        alert("Failed to delete address");
      }
    }

    document.getElementById("password-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const cur = document.getElementById("current_password").value;
      const nw = document.getElementById("new_password").value;
      const conf = document.getElementById("new_password_confirm").value;

      if (nw !== conf) {
        alert("New passwords do not match!");
        return;
      }

      try {
        await apiFetch("/users/change-password", {
          method: "POST",
          body: JSON.stringify({
            current_password: cur,
            new_password: nw,
            new_password_confirm: conf
          })
        });
        alert("Password updated successfully!");
        document.getElementById("password-form").reset();
      } catch (err) {
        alert(err.message || "Failed to change password");
      }
    });

    document.addEventListener("DOMContentLoaded", loadAccount);
  </script>
</body>
</html>
